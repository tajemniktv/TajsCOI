name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile TajsTweaks
    runs-on: windows-latest

    # This job needs the private CoI reference token. Run it only in the canonical
    # repository, and never for Dependabot or fork pull requests where Actions
    # secrets are intentionally unavailable.
    if: >-
      github.repository == 'tajemniktv/TajsCOI' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository))

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout TajsCOI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Captain of Industry references
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tajemniktv/TajsCOI-Refs
          token: ${{ secrets.COI_REFS_TOKEN }}
          path: coi-refs
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate reference snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $projectPath = 'src/Mods/TajsTweaks/TajsTweaks.csproj'
          $expectedVersion = (& dotnet msbuild $projectPath -nologo -getProperty:MaxVerifiedGameVersion).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to evaluate MaxVerifiedGameVersion from TajsTweaks.csproj.'
          }

          $referenceVersion = (Get-Content 'coi-refs/VERSION.txt' -Raw).Trim()

          if ([string]::IsNullOrWhiteSpace($expectedVersion)) {
              throw 'The evaluated TajsTweaks project does not define MaxVerifiedGameVersion.'
          }

          if ([string]::IsNullOrWhiteSpace($referenceVersion)) {
              throw 'TajsCOI-Refs/VERSION.txt is empty.'
          }

          if ($referenceVersion -ne $expectedVersion) {
              throw "CoI reference version mismatch: mod expects $expectedVersion, refs repo provides $referenceVersion."
          }

          $coiRoot = Join-Path $env:GITHUB_WORKSPACE "coi-refs\refs\$referenceVersion"
          $managedDir = Join-Path $coiRoot 'Captain of Industry_Data\Managed'

          if (-not (Test-Path $managedDir -PathType Container)) {
              throw "Managed reference directory does not exist: $managedDir"
          }

          foreach ($assembly in @('Mafi.dll', 'Mafi.Core.dll', 'Mafi.Base.dll')) {
              $assemblyPath = Join-Path $managedDir $assembly
              if (-not (Test-Path $assemblyPath -PathType Leaf)) {
                  throw "Required CoI reference is missing: $assemblyPath"
              }
          }

          "COI_ROOT=$coiRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Captain of Industry $referenceVersion references from $coiRoot"

      - name: Restore
        run: dotnet restore src/Mods/TajsTweaks/TajsTweaks.csproj

      - name: Build
        run: >-
          dotnet build src/Mods/TajsTweaks/TajsTweaks.csproj
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:DeployToModsFolder=false
          -p:CopyToUnityProject=false
          -p:CreateReleaseZip=false
